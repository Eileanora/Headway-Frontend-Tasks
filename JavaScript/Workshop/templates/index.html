<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="d-flex flex-column container">
    <header class="d-flex flex-column">
      <h1>Forex Exchange</h1>
      <p>Check out the current price for a currency pair</p>
    </header>
    <main class="d-flex">
      <div class="d-flex dropdown-wrapper">
        <!--Custom dropdown 1-->
        <div class="dropdown">
          <input type="checkbox" id="dropdown1">
          <label class="dropdown__label" for="dropdown1">
            <span class="dropdown__text">Choose Currency</span>
            <span class="dropdown__arrow"></span>
          </label>
          <ul class="dropdown__items">
          </ul> <!--dropdown items-->
        </div> <!--dropdown-->

        <!--Custom dropdown 2-->
        <div class="dropdown">
          <input type="checkbox" id="dropdown2">
          <label class="dropdown__label" for="dropdown2"> 
            <span class="dropdown__text">Choose Currency</span>
            <span class="dropdown__arrow"></span>
          </label>
          <ul class="dropdown__items">
          </ul> <!--dropdown items-->
        </div> <!--dropdown-->
      </div> <!--dropdown wrapper-->
      <div class="d-flex flex-column chart-wrapper">
        <div class="d-flex flex-column chart-header d-none">
          <div class="d-flex flex-row curr-icons">
            <span class="currency-flag--1 fi fis"></span>
            <span class="currency-flag--2 fi fis"></span>
            <span class="label d-flex align-items-center"><span>Forex.com</span></span>
          </div> <!--curr icons-->
          <div class="d-flex flex-row justify-content-between curr-info">
            <span class="currency-label">
              <span class="currency-label__text"></span><span>/</span><span class="currency-label__text "></span>
            </span>
            <span class="exchange-rate">No data yet :(</span>
          </div> <!--curr info-->
          <div class="d-flex flex-row justify-content-end curr-rate">
            <span class="rate-percentage">No data yet :(</span>
          </div>
        </div> <!--chart header-->
        <div class="chart-container">
          <canvas id="rate-chart"></canvas>
        </div> <!--chart container-->
        <div class="error-wrapper d-flex flex-column align-items-center d-none">
          <span class="error-message">No data selected yet :(</span>
        </div>
        <div class="d-flex flex-row justify-content-between align-self-center chart-intervals">
          <span class="interval" data-interval="15m">15M</span>
          <span class="interval" data-interval="1h">1H</span>
          <span class="interval" data-interval="1d">1D</span>
          <span class="interval" data-interval="1w">1W</span>
          <span class="interval" data-interval="1M">1M</span>
        </div>
      </div> <!--chart wrapper-->
    </main>
  </div> <!--container-->
</body>
<script type="module" src="../scripts/main.js"></script>
</html>
